name: build

on:
  push:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  MACOS_SDK_VERSION: 14.5
  MACOS_SDK_SHA256: 6e146275d19f027faa2e8354da5e0267513abf013b8f16ad65a231653a2b1c5d
  APPLE_CODESIGN_VERSION: 0.29.0
  APPLE_CODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install tools
        run: choco install upx ninja -y --no-progress
      # Reuse object files from earlier runs so only changed sources are compiled.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-x86_64
          max-size: 1G
      - name: Configure
        run: >
          cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_CONFIGURATION_TYPES=MinSizeRel
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --config MinSizeRel
      - uses: actions/upload-artifact@v4
        with:
          name: b-launcher-windows-x86_64
          path: build/MinSizeRel/b-launcher.exe

  linux:
    runs-on: ubuntu-24.04
    env:
      # Checkout gives the zig wrappers a new mtime on every run; hash their content instead.
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      # The zig toolchain, appimagetool and the sysroot are pinned, so they are fetched only once.
      # ~/.cache/zig/h (manifests) and /z (compiler_rt) let the configure probes skip rebuilding
      # zig's runtime for every -m flag combination; /o holds compile objects (~2 GB) and is left out.
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig/h
            ~/.cache/zig/z
            ${{ runner.temp }}/zig-x86_64-linux-${{ env.ZIG_VERSION }}
            ${{ runner.temp }}/appimagetool
            ${{ runner.temp }}/sysroot
          key: linux-tools-${{ env.ZIG_SHA256 }}-${{ hashFiles('cmake/package/linux-sysroot.sh') }}
          restore-keys: linux-tools-
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libwayland-bin
          if [ ! -x "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION/zig" ]; then
            curl -sSfL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
            echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c
            tar xJf zig.tar.xz -C "$RUNNER_TEMP"
            rm -f zig.tar.xz
          fi
          if [ ! -x "$RUNNER_TEMP/appimagetool" ]; then
            curl -sSfL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x "$RUNNER_TEMP/appimagetool"
          fi
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
      - name: Prepare sysroot
        run: |
          if [ ! -d "$RUNNER_TEMP/sysroot/usr/include" ]; then
            cmake/package/linux-sysroot.sh "$RUNNER_TEMP/sysroot"
          fi
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-x86_64-zig-${{ env.ZIG_VERSION }}
          max-size: 1G
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/zig-linux-x86_64.cmake -DBLB_SYSROOT="$RUNNER_TEMP/sysroot"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --target b-launcher
      - name: Package
        run: cmake/package/appimage.sh build/b-launcher build/B_Launcher-x86_64.AppImage "$RUNNER_TEMP/appimagetool"
      - uses: actions/upload-artifact@v4
        with:
          name: b-launcher-linux-x86_64
          path: build/B_Launcher-x86_64.AppImage

  macos:
    runs-on: ubuntu-24.04
    env:
      # Checkout gives the zig wrappers a new mtime on every run; hash their content instead.
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      # The zig toolchain, rcodesign and the macOS SDK are pinned, so they are fetched only once.
      # ~/.cache/zig/h (manifests) and /z (compiler_rt) let the configure probes skip rebuilding
      # zig's runtime for every -m flag combination; /o holds compile objects (~2 GB) and is left out.
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig/h
            ~/.cache/zig/z
            ${{ runner.temp }}/zig-x86_64-linux-${{ env.ZIG_VERSION }}
            ${{ runner.temp }}/apple-codesign-${{ env.APPLE_CODESIGN_VERSION }}-x86_64-unknown-linux-musl
            ${{ runner.temp }}/MacOSX${{ env.MACOS_SDK_VERSION }}.sdk
          key: macos-tools-${{ env.ZIG_SHA256 }}-${{ env.MACOS_SDK_SHA256 }}-${{ env.APPLE_CODESIGN_SHA256 }}
          restore-keys: macos-tools-
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip
          if [ ! -x "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION/zig" ]; then
            curl -sSfL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
            echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c
            tar xJf zig.tar.xz -C "$RUNNER_TEMP"
            rm -f zig.tar.xz
          fi
          if [ ! -x "$RUNNER_TEMP/apple-codesign-$APPLE_CODESIGN_VERSION-x86_64-unknown-linux-musl/rcodesign" ]; then
            curl -sSfL -o rcodesign.tar.gz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$APPLE_CODESIGN_VERSION/apple-codesign-$APPLE_CODESIGN_VERSION-x86_64-unknown-linux-musl.tar.gz"
            echo "$APPLE_CODESIGN_SHA256  rcodesign.tar.gz" | sha256sum -c
            tar xzf rcodesign.tar.gz -C "$RUNNER_TEMP"
            rm -f rcodesign.tar.gz
          fi
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/apple-codesign-$APPLE_CODESIGN_VERSION-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Prepare SDK
        run: |
          if [ ! -d "$RUNNER_TEMP/MacOSX$MACOS_SDK_VERSION.sdk" ]; then
            curl -sSfL -o sdk.tar.xz "https://github.com/joseluisq/macosx-sdks/releases/download/$MACOS_SDK_VERSION/MacOSX$MACOS_SDK_VERSION.sdk.tar.xz"
            echo "$MACOS_SDK_SHA256  sdk.tar.xz" | sha256sum -c
            tar xJf sdk.tar.xz -C "$RUNNER_TEMP"
            rm -f sdk.tar.xz
          fi
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-arm64-zig-${{ env.ZIG_VERSION }}
          max-size: 1G
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/zig-macos-aarch64.cmake -DBLB_SYSROOT="$RUNNER_TEMP/MacOSX$MACOS_SDK_VERSION.sdk"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --target b-launcher
      - name: Package
        run: |
          cmake/package/macos-app.sh build/b-launcher build/app "$(sed -n 's/^project(b-launcher VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          cd build/app && zip -qry ../B_Launcher-macos-arm64.zip "B Launcher.app"
      - uses: actions/upload-artifact@v4
        with:
          name: b-launcher-macos-arm64
          path: build/B_Launcher-macos-arm64.zip